name: b43

# b43 aberto para o BCM4360 (AC-PHY) compilado no SDK da imagem publicada.
# Os .ko saem soltos: no roteador vao para /tmp e entram com insmod (nada na flash).

on:
  push:
    branches: [b43, b43-pr25788]
    paths:
      - 'b43/**'
      - '.github/workflows/b43.yml'
  workflow_dispatch:

env:
  RELEASE: openwrt-25.12-r7000-2

jobs:
  kmod:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # SDK com o mac80211 ja compilado: a chave so muda com a release, o
      # workflow ou os patches fora do b43.  Com cache, so o b43 recompila.
      - name: Cache do SDK compilado
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: sdk
          key: sdk-mac80211-v3-${{ env.RELEASE }}-${{ hashFiles('b43/patches/subsys/*.patch') }}

      - name: Dependencias
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: SDK da release
        if: steps.sdk.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" -p 'openwrt-sdk-*' -O sdk.tar.zst
          mkdir sdk && tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Configura mac80211 com b43 AC
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          cd sdk
          ./scripts/feeds update base
          ./scripts/feeds install kmod-b43
          M=feeds/base/package/kernel/mac80211
          [ -d "$M" ] || M=$(dirname $(find feeds -path '*kernel/mac80211/Makefile' | head -1))
          echo "MAC80211=$M" >> $GITHUB_ENV
          # bool: tem de ser =y (config_package da "m", que o Kconfig descarta)
          sed -i 's/^config-\$(call config_package,b43) += B43$/&\nconfig-$(if $(call config_package,b43),y) += B43_PHY_AC/' $M/broadcom.mk
          grep -n 'B43_PHY_AC' $M/broadcom.mk
          make defconfig
          # o SDK liga todos os kmods (ALL_KMODS): so o b43 e dependencias
          sed -i -E '/^CONFIG_(ALL(_KMODS|_NONSHARED)?|AUTOREMOVE)=y/d; /^CONFIG_PACKAGE_kmod-.*=m$/d' .config
          cat >> .config <<'EOF'
          # CONFIG_AUTOREMOVE is not set
          # CONFIG_ALL_KMODS is not set
          # CONFIG_ALL is not set
          # CONFIG_ALL_NONSHARED is not set
          CONFIG_PACKAGE_kmod-b43=m
          CONFIG_PACKAGE_B43_DEBUG=y
          CONFIG_PACKAGE_B43_BUSES_BCMA=y
          # CONFIG_PACKAGE_B43_PHY_N is not set
          # CONFIG_PACKAGE_B43_PHY_G is not set
          # CONFIG_PACKAGE_B43_PHY_LP is not set
          # CONFIG_PACKAGE_B43_PHY_HT is not set
          EOF
          sed -i 's/^ *//' .config
          make defconfig
          grep -E 'b43|B43|mac80211|cfg80211' .config

      # como patches do pacote: editar a arvore preparada nao adianta, o
      # compile refaz o prepare quando a config muda.  950 = b43 AC-PHY (gerado
      # de b43/src por tools/b43-patch.sh); 951 = mac80211 sem CRYPTO_CMAC
      # (o kernel da imagem nao tem; o cmac(aes) so e pedido para 802.11w)
      - name: Patches do b43 e do mac80211
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          cp b43/patches/brcm/*.patch sdk/$MAC80211/patches/brcm/
          cp b43/patches/subsys/*.patch sdk/$MAC80211/patches/subsys/
          cd sdk
          make package/mac80211/prepare V=s -j$(nproc) 2>&1 | grep -E 'Applying|FAILED|rej' | grep -E '95[01]|FAILED|rej'
          for D in build_dir/target-*/linux-*/*/backports-*; do
            echo "== $D"
            grep -n -A2 'config B43_PHY_AC' $D/drivers/net/wireless/broadcom/b43/Kconfig
            grep -c 'CRYPTO_CMAC' $D/net/mac80211/Kconfig || true
          done

      - name: Compila
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          cd sdk
          set -o pipefail
          make package/mac80211/compile V=s -j$(nproc) 2>&1 | tee ../build.log | tail -40
          grep -E 'CPTCFG_B43_PHY_AC|CPTCFG_B43_DEBUG' build_dir/target-*/linux-*/*/backports-*/.config

      # o Compila sempre termina com erro no empacotamento (cordic), mas os
      # .ko saem: salva se o b43.ko existe
      - name: Salva o SDK compilado
        if: always() && steps.sdk.outputs.cache-hit != 'true'
        run: |
          ls sdk/build_dir/target-*/linux-*/mac80211-regular/backports-*/drivers/net/wireless/broadcom/b43/main.o
          echo "OK_SAVE=1" >> $GITHUB_ENV
      - uses: actions/cache/save@v4
        if: always() && env.OK_SAVE == '1'
        with:
          path: sdk
          key: ${{ steps.sdk.outputs.cache-primary-key }}

      # sempre (com ou sem cache): b43 do backports puro + patches brcm do
      # OpenWrt (81x) + os nossos, e so os modulos recompilam
      - name: b43 incremental
        run: |
          set -o pipefail
          cd sdk
          MAC80211=$(dirname $(find feeds -path '*kernel/mac80211/Makefile' | head -1))
          BP=$(ls -d $PWD/build_dir/target-*/linux-*/mac80211-regular/backports-*)
          V=$(basename $BP | sed 's/backports-//')
          curl -sL https://github.com/openwrt/backports/releases/download/backports-v$V/backports-$V.tar.zst | tar --zstd -x -C /tmp
          B=$BP/drivers/net/wireless/broadcom/b43
          rm -rf $B && cp -a /tmp/backports-$V/drivers/net/wireless/broadcom/b43 $B
          # so a parte do b43 do build/400 (debugfs na API do 6.12)
          sudo apt-get install -y patchutils >/dev/null
          filterdiff -i '*/drivers/net/wireless/broadcom/b43/*' $MAC80211/patches/build/400-*.patch | patch -d $BP -p1 -F0
          for p in $MAC80211/patches/brcm/81*-b43*.patch ../b43/patches/brcm/*.patch; do
            echo "== $p"; patch -d $BP -p1 -F0 -s < $p
          done
          T=$(ls -d $PWD/staging_dir/toolchain-*)
          export PATH=$T/bin:$PATH STAGING_DIR=$PWD/staging_dir
          LX=$(ls -d $PWD/build_dir/target-*/linux-*/linux-6.*)
          SYMV=$(ls $PWD/build_dir/target-*/linux-*/symvers/*.symvers | tr '\n' ' ')
          make -j$(nproc) -C "$BP" CROSS_COMPILE=arm-openwrt-linux-muslgnueabi- ARCH=arm \
            CC=arm-openwrt-linux-muslgnueabi-gcc KBUILD_HAVE_NLS=no CONFIG_SHELL=bash \
            KCFLAGS="-fno-caller-saves -falign-functions=32" \
            KBUILD_EXTRA_SYMBOLS="$SYMV" KERNELRELEASE=$(basename $LX | sed 's/linux-//') \
            EXTRA_CFLAGS="-I$BP/include" KLIB_BUILD="$LX" MODPROBE=true \
            KLIB=/lib/modules/$(basename $LX | sed 's/linux-//') KBUILD_LDFLAGS_MODULE_PREREQ= \
            modules 2>&1 | tee -a ../build.log | tail -30

      - name: Config do backports
        if: always()
        run: |
          grep -E '^CONFIG_ALL|kmod-(b43|mac80211|cfg80211|bcma)' sdk/.config || true
          for c in sdk/build_dir/target-*/linux-*/*/backports-*/.config; do
            echo "== $c"; grep -E 'B43|BCMA|MAC80211=|CFG80211=' $c || true
          done

      # firmware que o PR 25788 usa: ucode42 do broadcom-wl 6.30.163.46
      - name: Firmware 6.30.163.46
        if: always()
        run: |
          sudo apt-get install -y b43-fwcutter >/dev/null
          wget -q https://www.lwfinger.com/b43-firmware/broadcom-wl-6.30.163.46.tar.bz2
          tar xjf broadcom-wl-6.30.163.46.tar.bz2
          mkdir -p fw && b43-fwcutter -w fw broadcom-wl-6.30.163.46.wl_apsta.o
          ls -la fw/b43 | grep -E '42|ac1' || true

      - name: Junta os modulos
        if: always()
        run: |
          mkdir -p out
          find sdk/build_dir/target-*/linux-*/*/backports-* -name '*.ko' -exec cp {} out/ \;
          ls -la out
          grep -E 'undefined!|error:' build.log | sort -u | head -40 || true

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b43-ac
          path: |
            build.log
            out/*.ko
            fw/b43/*42*.fw
          if-no-files-found: warn
