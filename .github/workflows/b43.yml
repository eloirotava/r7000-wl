name: b43

# b43 aberto para o BCM4360 (AC-PHY) compilado no SDK da imagem publicada.
# Os .ko saem soltos: no roteador vao para /tmp e entram com insmod (nada na flash).

on:
  push:
    branches: [b43]
    paths:
      - 'b43/**'
      - '.github/workflows/b43.yml'
  workflow_dispatch:

env:
  RELEASE: openwrt-25.12-r7000-2

jobs:
  kmod:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: SDK da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" -p 'openwrt-sdk-*' -O sdk.tar.zst
          mkdir sdk && tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Configura mac80211 com b43 AC
        run: |
          cd sdk
          ./scripts/feeds update base
          ./scripts/feeds install kmod-b43
          M=feeds/base/package/kernel/mac80211
          [ -d "$M" ] || M=$(dirname $(find feeds -path '*kernel/mac80211/Makefile' | head -1))
          echo "MAC80211=$M" >> $GITHUB_ENV
          # bool: tem de ser =y (config_package da "m", que o Kconfig descarta)
          sed -i 's/^config-\$(call config_package,b43) += B43$/&\nconfig-$(if $(call config_package,b43),y) += B43_PHY_AC/' $M/broadcom.mk
          grep -n 'B43_PHY_AC' $M/broadcom.mk
          make defconfig
          # o SDK liga todos os kmods (ALL_KMODS): so o b43 e dependencias
          sed -i -E '/^CONFIG_ALL(_KMODS|_NONSHARED)?=y/d; /^CONFIG_PACKAGE_kmod-.*=m$/d' .config
          cat >> .config <<'EOF'
          # CONFIG_ALL_KMODS is not set
          # CONFIG_ALL is not set
          # CONFIG_ALL_NONSHARED is not set
          CONFIG_PACKAGE_kmod-b43=m
          CONFIG_PACKAGE_B43_DEBUG=y
          CONFIG_PACKAGE_B43_BUSES_BCMA=y
          # CONFIG_PACKAGE_B43_PHY_N is not set
          # CONFIG_PACKAGE_B43_PHY_G is not set
          # CONFIG_PACKAGE_B43_PHY_LP is not set
          # CONFIG_PACKAGE_B43_PHY_HT is not set
          EOF
          sed -i 's/^ *//' .config
          make defconfig
          grep -E 'b43|B43|mac80211|cfg80211' .config

      # como patches do pacote: editar a arvore preparada nao adianta, o
      # compile refaz o prepare quando a config muda.  950 = b43 AC-PHY (gerado
      # de b43/src por tools/b43-patch.sh); 951 = mac80211 sem CRYPTO_CMAC
      # (o kernel da imagem nao tem; o cmac(aes) so e pedido para 802.11w)
      - name: Patches do b43 e do mac80211
        run: |
          cp b43/patches/brcm/*.patch sdk/$MAC80211/patches/brcm/
          cp b43/patches/subsys/*.patch sdk/$MAC80211/patches/subsys/
          cd sdk
          make package/mac80211/prepare V=s -j$(nproc) 2>&1 | grep -E 'Applying|FAILED|rej' | grep -E '95[01]|FAILED|rej'
          for D in build_dir/target-*/linux-*/*/backports-*; do
            echo "== $D"
            grep -n -A2 'config B43_PHY_AC' $D/drivers/net/wireless/broadcom/b43/Kconfig
            grep -c 'CRYPTO_CMAC' $D/net/mac80211/Kconfig || true
          done

      - name: Compila
        run: |
          cd sdk
          set -o pipefail
          make package/mac80211/compile V=s -j$(nproc) 2>&1 | tee ../build.log | tail -40
          grep -E 'CPTCFG_B43_PHY_AC|CPTCFG_B43_DEBUG' build_dir/target-*/linux-*/*/backports-*/.config

      - name: Config do backports
        if: always()
        run: |
          grep -E '^CONFIG_ALL|kmod-(b43|mac80211|cfg80211|bcma)' sdk/.config || true
          for c in sdk/build_dir/target-*/linux-*/*/backports-*/.config; do
            echo "== $c"; grep -E 'B43|BCMA|MAC80211=|CFG80211=' $c || true
          done

      - name: Junta os modulos
        if: always()
        run: |
          mkdir -p out
          find sdk/build_dir/target-*/linux-*/*/backports-* -name '*.ko' -exec cp {} out/ \;
          ls -la out
          grep -E 'undefined!|error:' build.log | sort -u | head -40 || true

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b43-ac
          path: |
            build.log
            out/*.ko
          if-no-files-found: warn
