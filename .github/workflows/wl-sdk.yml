name: wl-sdk

# kmod-wl-r7000 compilado no SDK da imagem publicada (kernel exato do R7000)

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'scripts/**'
      - 'tools/**'
      - '.github/workflows/wl-sdk.yml'
  workflow_dispatch:

env:
  RELEASE: openwrt-25.12-r7000-2

jobs:
  kmod:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext libncurses-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget zstd \
            binutils-arm-linux-gnueabi

      - name: SDK da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" -p 'openwrt-sdk-*' -O sdk.tar.zst
          mkdir sdk && tar -I zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Arvore Broadcom + nucleo
        run: |
          S=package/kernel/wl-r7000/src
          ./scripts/fetch-brcm.sh $S/brcm
          mkdir -p $S/core
          CROSS_COMPILE=arm-linux-gnueabi- ./scripts/prep-core.sh $S/brcm $S/core/wl_core.o
          cp -r package/kernel/wl-r7000 sdk/package/

      - name: Compila kmod-wl-r7000
        run: |
          cd sdk
          ./scripts/feeds update base
          ./scripts/feeds install kmod-nf-conntrack || true
          make defconfig
          echo 'CONFIG_PACKAGE_kmod-wl-r7000=m' >> .config
          # netconsole: oops do wl sai por UDP e sobrevive ao reboot
          ./scripts/feeds install -p base linux || true
          echo 'CONFIG_PACKAGE_kmod-netconsole=m' >> .config
          make defconfig
          set -o pipefail
          make package/wl-r7000/compile V=s -j$(nproc) 2>&1 | tee ../build.log | tail -40
          make package/linux/compile -j$(nproc) 2>&1 | tail -15 || true

      - name: libnvram substituto (para o nas do DD-WRT)
        run: |
          export STAGING_DIR=$PWD/sdk/staging_dir
          CC=$(ls sdk/staging_dir/toolchain-*/bin/arm-openwrt-linux-muslgnueabi-gcc)
          mkdir -p out
          $CC -shared -fPIC -O2 -Wall -Wl,-soname,libnvram.so \
            -o out/libnvram.so tools/libnvram-shim/nvram.c
          $CC -O2 -Wall -o out/wlcountry tools/wlcountry/wlcountry.c
          file out/libnvram.so out/wlcountry

      - name: Resumo
        if: always()
        run: |
          grep -E 'undefined!|error:' build.log | sort -u | head -40 || true
          find sdk/build_dir -name wl.ko -exec ls -la {} \;
          find sdk/bin -name 'kmod-wl-r7000*' -exec ls -la {} \;

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-wl-r7000
          path: |
            build.log
            sdk/build_dir/target-*/linux-*/wl-r7000/wl.ko
            sdk/bin/targets/*/*/packages/kmod-wl-r7000*
            sdk/bin/targets/*/*/packages/kmod-netconsole*
            out/libnvram.so
            out/wlcountry
            sdk/bin/packages/*/*/kmod-wl-r7000*
          if-no-files-found: warn
