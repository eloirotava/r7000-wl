name: wl-module

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'scripts/**'
      - 'kernel/**'
      - 'patches/**'
      - '.github/workflows/module.yml'
  workflow_dispatch:

env:
  KVER: 6.12.112
  ARCH: arm
  CROSS_COMPILE: arm-linux-gnueabi-

jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            bc bison flex libssl-dev libelf-dev cpio

      - name: Cache do kernel (restore)
        id: kcache
        uses: actions/cache/restore@v4
        with:
          path: linux-${{ env.KVER }}
          key: kernel-${{ env.KVER }}-${{ hashFiles('patches/990-skbuff-bcm-wl-abi.patch', 'kernel/northstar.config') }}-v1

      - name: Kernel ${{ env.KVER }} com o patch do sk_buff
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz
          tar xf linux-$KVER.tar.xz
          cd linux-$KVER
          patch -p1 < ../patches/990-skbuff-bcm-wl-abi.patch
          make multi_v7_defconfig
          ./scripts/kconfig/merge_config.sh -m .config ../kernel/northstar.config
          make olddefconfig
          make -j$(nproc) zImage modules 2>&1 | tail -20

      # salva ja aqui: o job do modulo pode falhar e o kernel nao muda
      - name: Cache do kernel (save)
        if: steps.kcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: linux-${{ env.KVER }}
          key: ${{ steps.kcache.outputs.cache-primary-key }}

      - name: Config efetiva
        run: grep -E 'CONFIG_(NF_CONNTRACK|SKB_EXTENSIONS|NET_XGRESS|ARM_HEAVY_MB|BCM47XX_NVRAM|PCIE_IPROC_BCMA|NET_SWITCHDEV|IP_VS|NF_TABLES)=' linux-$KVER/.config || true

      - name: Arvore Broadcom (DD-WRT) + nucleo
        run: |
          S=package/kernel/wl-r7000/src
          ./scripts/fetch-brcm.sh $S/brcm
          mkdir -p $S/core
          ./scripts/prep-core.sh $S/brcm $S/core/wl_core.o

      - name: Compila wl.ko
        run: |
          S=$PWD/package/kernel/wl-r7000/src
          set -o pipefail
          make -C linux-$KVER M=$S -j$(nproc) KBUILD_MODPOST_WARN=1 modules 2>&1 | tee build.log
          ls -la $S/wl.ko

      - name: Resumo
        if: always()
        run: |
          S=package/kernel/wl-r7000/src
          echo "== erros de compilacao"; grep -E 'error:' build.log | sort | uniq -c | sort -rn | head -40 || true
          echo "== modpost indefinidos"; grep -E 'undefined!' build.log | sed -E 's/.*"(.*)".*/\1/' | sort -u > undef.txt || true; wc -l < undef.txt; cat undef.txt
          echo "== GPL-only"; grep -iE 'GPL-only' build.log | head -40 || true

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wl-module
          path: |
            build.log
            undef.txt
            package/kernel/wl-r7000/src/wl.ko
            package/kernel/wl-r7000/src/core/wl_core.o.undef
          if-no-files-found: warn
