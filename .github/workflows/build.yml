name: openwrt-r7000

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'config.seed'
      - 'package/kernel/wl-r7000/Makefile'
      - 'files/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves
          df -h /

      - name: Libera espaco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: OpenWrt
        run: |
          git clone --depth 1 -b "$OPENWRT_BRANCH" https://github.com/openwrt/openwrt.git openwrt
          cp patches/*.patch openwrt/target/linux/bcm53xx/patches-6.12/
          cp -r files openwrt/files
          sudo apt-get install -y binutils-arm-linux-gnueabi
          ./scripts/fetch-brcm.sh package/kernel/wl-r7000/src/brcm
          mkdir -p package/kernel/wl-r7000/src/core
          CROSS_COMPILE=arm-linux-gnueabi- ./scripts/prep-core.sh \
            package/kernel/wl-r7000/src/brcm package/kernel/wl-r7000/src/core/wl_core.o
          cp -r package/kernel/wl-r7000 openwrt/package/kernel/
          cp config.seed openwrt/.config
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          grep -E 'r7000|DEBUG_INFO|CONFIG_SDK' .config
          # falha cedo se o defconfig derrubou o que tem de ir na imagem
          for p in kmod-wl-r7000 kmod-wireguard uhttpd-mod-ucode; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "falta $p"; exit 1; }
          done

      - name: Download
        run: cd openwrt && make download -j8

      - name: Toolchain + kernel
        run: |
          cd openwrt
          make -j$(nproc) toolchain/install || make -j1 V=s toolchain/install
          make -j$(nproc) target/linux/compile || make -j1 V=s target/linux/compile

      - name: Espaco de usuario do wifi e wstunnel em files/
        run: |
          sudo apt-get install -y squashfs-tools
          ./scripts/fetch-ddwrt-userland.sh openwrt/files
          export STAGING_DIR=$PWD/openwrt/staging_dir
          TC=$(ls -d $PWD/openwrt/staging_dir/toolchain-arm_*)
          CC=$TC/bin/arm-openwrt-linux-muslgnueabi-gcc
          $CC -shared -fPIC -O2 -Wall -Wl,-soname,libnvram.so \
            -o openwrt/files/usr/lib/ddwrt/libnvram.so tools/libnvram-shim/nvram.c
          $CC -O2 -Wall -o openwrt/files/usr/sbin/wlcountry tools/wlcountry/wlcountry.c
          # wstunnel soft-float: o BCM4708 nao tem VFP
          rustup target add armv7-unknown-linux-musleabi
          git clone --depth 1 -b v10.6.2 https://github.com/erebe/wstunnel /tmp/wstunnel
          (cd /tmp/wstunnel &&
            CC_armv7_unknown_linux_musleabi=$CC \
            AR_armv7_unknown_linux_musleabi=$TC/bin/arm-openwrt-linux-muslgnueabi-ar \
            CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABI_LINKER=$CC \
            CFLAGS_armv7_unknown_linux_musleabi=-mfloat-abi=soft \
            cargo build --release --target armv7-unknown-linux-musleabi)
          mkdir -p openwrt/files/usr/bin
          $TC/bin/arm-openwrt-linux-muslgnueabi-strip \
            -o openwrt/files/usr/bin/wstunnel \
            /tmp/wstunnel/target/armv7-unknown-linux-musleabi/release/wstunnel
          file openwrt/files/usr/sbin/* openwrt/files/usr/bin/* openwrt/files/usr/lib/ddwrt/*

      - name: Confere ABI do sk_buff (pahole)
        run: |
          VMLINUX=$(ls openwrt/build_dir/target-*/linux-bcm53xx_generic/linux-6.12.*/vmlinux)
          echo "$VMLINUX"
          set -o pipefail
          pahole -C sk_buff "$VMLINUX" | tee skb-pahole.txt
          python3 scripts/check-skb-abi.py skb-pahole.txt | tee skb-abi.txt

      - name: Imagem + SDK
        run: cd openwrt && (make -j$(nproc) IGNORE_ERRORS=m || make -j1 V=s IGNORE_ERRORS=m)

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7000-openwrt
          path: |
            skb-pahole.txt
            skb-abi.txt
            openwrt/bin/targets/bcm53xx/generic/*r7000*
            openwrt/bin/targets/bcm53xx/generic/openwrt-sdk-*
            openwrt/bin/targets/bcm53xx/generic/*.manifest
            openwrt/bin/targets/bcm53xx/generic/packages/kmod-wl-r7000*
            openwrt/build_dir/target-*/linux-bcm53xx_generic/wl-r7000/wl.ko
          if-no-files-found: warn
