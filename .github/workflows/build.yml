name: openwrt-r7000

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OPENWRT_BRANCH: openwrt-25.12

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves
          df -h /

      - name: Libera espaco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: OpenWrt
        run: |
          git clone --depth 1 -b "$OPENWRT_BRANCH" https://github.com/openwrt/openwrt.git openwrt
          cp patches/*.patch openwrt/target/linux/bcm53xx/patches-6.12/
          cp -r files openwrt/files
          cp config.seed openwrt/.config
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          grep -E 'r7000|DEBUG_INFO|CONFIG_SDK' .config

      - name: Download
        run: cd openwrt && make download -j8

      - name: Toolchain + kernel
        run: |
          cd openwrt
          make -j$(nproc) toolchain/install || make -j1 V=s toolchain/install
          make -j$(nproc) target/linux/compile || make -j1 V=s target/linux/compile

      - name: Confere ABI do sk_buff (pahole)
        run: |
          VMLINUX=$(ls openwrt/build_dir/target-*/linux-bcm53xx_generic/linux-6.12.*/vmlinux)
          echo "$VMLINUX"
          pahole -C sk_buff "$VMLINUX" | tee skb-pahole.txt
          python3 scripts/check-skb-abi.py skb-pahole.txt | tee skb-abi.txt

      - name: Imagem + SDK
        run: cd openwrt && (make -j$(nproc) || make -j1 V=s)

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7000-openwrt
          path: |
            skb-pahole.txt
            skb-abi.txt
            openwrt/bin/targets/bcm53xx/generic/*r7000*
            openwrt/bin/targets/bcm53xx/generic/openwrt-sdk-*
            openwrt/bin/targets/bcm53xx/generic/*.manifest
          if-no-files-found: warn
